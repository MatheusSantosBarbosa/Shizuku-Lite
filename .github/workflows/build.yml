name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair projeto
        run: unzip -q ShizukuLite.zip

      - name: Ativar AndroidX
        run: echo "android.useAndroidX=true" >> ShizukuLite/gradle.properties

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK de debug
        working-directory: ShizukuLite
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ShizukuLite-debug-apk
          path: ShizukuLite/app/build/outputs/apk/debug/*.apk
