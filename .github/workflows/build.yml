name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair projeto
        run: unzip -q ShizukuLite.zip

      - name: Ativar AndroidX
        run: echo "android.useAndroidX=true" >> ShizukuLite/gradle.properties

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Dar permissao ao gradlew
        run: chmod +x ShizukuLite/gradlew

      - name: Compilar APK de debug
        working-directory: ShizukuLite
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ShizukuLite-debug-apk
          path: ShizukuLite/app/build/outputs/apk/debug/*.apk

          
